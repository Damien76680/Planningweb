<!DOCTYPE html>
<html>
<head>
  <title>Planning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    <div id="editModal" class="modal">

    <div class="modal-content">

        <h2>Modifier la tâche</h2>

        <input id="edit_nom" placeholder="Nom">

        <input id="edit_client" placeholder="Client">

        <select id="edit_charge_affaire">
            <option value="">-- Chargé d'affaire --</option>
            <option value="Damien">Damien</option>
            <option value="Stéphane">Stéphane</option>
            <option value="Kevin">Kevin</option>
            <option value="Fabien">Fabien</option>
        </select>

        <input id="edit_duree" type="number" step="0.5">

        <input
            id="edit_deadline"
            placeholder="JJMMAAAA"
        >

        <div class="modal-buttons">

            <button onclick="closeModal()">
                Annuler
            </button>

            <button onclick="saveEdit()">
                Sauvegarder
            </button>

        </div>

    </div>

</div>
    
    
    body {
      font-family: Arial;
      margin: 10px;
    }

#adminPanel {
    display: none;
}
      .task {
  display: flex;
  align-items: center;
  padding: 4px;
  border: 1px solid #ccc;
  border-left: 8px solid transparent;
  margin: 3px 0;
  font-size: 12px;
}
    

    .header {
      font-weight: bold;
      background: #eee;
    }

    .col-nom { width: 220px; }
    .col-charge{
    min-width:120px;
    font-weight:bold;
    color:#0055aa;
}
    .col-client { width: 100px; }
    .col-duree { width: 50px; }
    .col-debut {
    width: 140px;
}


  .col-fin {
    width: 140px;
    font-weight: bold;
}

    .col-deadline { width: 80px; margin-left: 10px; }
    .col-etat { width: 100px; }
    .col-actions { width: 140px; }

    .task span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task.retard {
      background-color: #ffe5e5;
      border-left: 8px solid red;
    }

    .task.done {
      background-color: #e6ffe6;
      border-left: 8px solid green;
    }

    button {
      font-size: 11px;
      padding: 2px 4px;
      margin: 2px;
    }

    #settingsForm div {
      margin: 6px 0;
    }

    input {
      margin: 3px;
    }

    #atelierView {
      margin-top: 15px;
    }

    .atelier-user {
      margin-bottom: 20px;
      border: 1px solid #ccc;
      padding: 10px;
    }

    .atelier-user h3 {
      margin: 0 0 10px 0;
      background: #eee;
      padding: 5px;
    }
  </style>
</head>

<body>

<div style="
    text-align:center;
    background:linear-gradient(
        90deg,
        #111827,
        #1f2937
    );
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
    border-bottom:4px solid #00a3e0;
">

    <img
        src="/static/RecabMeca-logoblanc-compressor.png"
        alt="RECAB MECA"
style="
    max-width:300px;
    width:100%;
    height:auto;
"
      >
    <h2
    id="planningTitle"
    style="
        color:white;
        margin-top:10px;
        margin-bottom:0;
        font-size:28px;
    "
      
></h2>

</div>
<h2 id="planningTitle"></h2>



<hr>

<h3>Tâches</h3>

<div class="task header">
  <span class="col-nom">Nom</span>
  <span class="col-client">Client</span>
  <span class="col-charge">Chargé affaire</span>
  <span class="col-duree">Durée</span>
  <span class="col-debut">Début</span>
  <span class="col-fin">Fin</span>
  <span class="col-deadline">Deadline</span>
  <span class="col-etat">État</span>
  <span class="col-actions">Actions</span>
</div>

<div id="tasks"></div>

<div id="atelierView"></div>

<h3>Nouvelle tâche</h3>
  <input id="nom" placeholder="Nom">
  <select id="charge_affaire">
    <option value="">-- Chargé d'affaire --</option>
    <option value="Damien">Damien</option>
    <option value="Samuel">Samuel</option>
    <option value="Quentin">Quentin</option>
    <option value="Georges">Georges</option>
    <option value="Sylvain">Sylvain</option>
</select>
  <input id="client" placeholder="Client">
  <input id="duree" placeholder="Durée">
  <input id="deadline" placeholder="JJMMAAAA">
  <button onclick="addTask()">Ajouter</button>

  <hr>
<button onclick="toggleAdmin()">
    ⚙️ Administration
</button>

<br><br>
<div id="adminPanel">
  <h3>Congés</h3>

  <input id="holiday" placeholder="JJMMAAAA">
  <button onclick="addHoliday()">Ajouter</button>

  <ul id="holidayList"></ul>

  <hr>

  <h3>Paramètres horaires</h3>

  <div id="settingsForm">

    <div>
      Lundi :
      <input id="mon1_start" type="time">
      -
      <input id="mon1_end" type="time">

      <input id="mon2_start" type="time">
      -
      <input id="mon2_end" type="time">
    </div>

    <div>
      Mardi :
      <input id="tue1_start" type="time">
      -
      <input id="tue1_end" type="time">

      <input id="tue2_start" type="time">
      -
      <input id="tue2_end" type="time">
    </div>

    <div>
      Mercredi :
      <input id="wed1_start" type="time">
      -
      <input id="wed1_end" type="time">

      <input id="wed2_start" type="time">
      -
      <input id="wed2_end" type="time">
    </div>

    <div>
      Jeudi :
      <input id="thu1_start" type="time">
      -
      <input id="thu1_end" type="time">

      <input id="thu2_start" type="time">
      -
      <input id="thu2_end" type="time">
    </div>

    <div>
      Vendredi :
      <input id="fri1_start" type="time">
      -
      <input id="fri1_end" type="time">
    </div>

  </div>

  <button onclick="saveSettings()">Sauvegarder</button>
  <h3>Sauvegarde</h3>

<button onclick="exportData()">
    Exporter les données
</button>

<br><br>

<input
    type="file"
    id="importFile"
    accept=".json"
/>

<button onclick="importData()">
    Importer les données
</button>
</div>


<hr>


<script src="/static/app.js"></script>

</body>
</html>
